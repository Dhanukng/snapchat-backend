version: '3.9'
services:
  mysql:
    image: mysql:8.4
    container_name: snap-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: snapdb
      MYSQL_USER: snapuser
      MYSQL_PASSWORD: snappass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: snap-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mysql_data:
