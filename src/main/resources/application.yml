server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: snapbackend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/snapdb}
    username: ${SPRING_DATASOURCE_USERNAME:snapuser}
    password: ${SPRING_DATASOURCE_PASSWORD:snappass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    timeout: 2000ms
  output:
    ansi:
      enabled: ALWAYS
  jackson:
    time-zone: UTC

jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-secret}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  rate-limit:
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:5}
    sensitive-per-minute: ${RATE_LIMIT_SENSITIVE_PER_MINUTE:60}

aws:
  s3:
    endpoint: ${AWS_S3_ENDPOINT:http://localhost:9000}
    access-key: ${AWS_S3_ACCESS_KEY:minioadmin}
    secret-key: ${AWS_S3_SECRET_KEY:minioadmin}
    region: ${AWS_S3_REGION:us-east-1}
    bucket: ${AWS_S3_BUCKET:snap-media}
    presign-expiration-seconds: ${AWS_S3_PRESIGN_EXPIRATION_SECONDS:3600}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    com.example.snapbackend: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
